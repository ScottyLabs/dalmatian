[project]
name = "dalmatian"
revision = "1.0"

[providers]
local = "dotenv://.env"
vault = "vault://secrets.scottylabs.org/secret"
openbao-ci = "openbao://secrets.scottylabs.org/secret?auth=jwt&role=ci&audience=openbao"

[profiles.dev]
DISCORD_TOKEN = { description = "Discord bot token from the Developer Portal Bot tab", providers = [
  "local",
] }
DISCORD_CLIENT_ID = { description = "Discord application client ID from the OAuth2 tab", providers = [
  "local",
] }
GOOGLE_MAPS_API_KEY = { description = "Google Maps Static API key for dining hall map previews", required = false, providers = [
  "vault",
  "local",
] }

[profiles.prod]
DISCORD_TOKEN = { description = "Production Discord bot token" }
DISCORD_CLIENT_ID = { description = "Production Discord application client ID" }
GOOGLE_MAPS_API_KEY = { description = "Google Maps Static API key", required = false }

[profiles.ci.defaults]
required = false
providers = ["openbao-ci"]

[profiles.ci]
DISCORD_TOKEN = { description = "Discord bot token, unused by checks" }
DISCORD_CLIENT_ID = { description = "Discord application client ID, unused by checks" }
